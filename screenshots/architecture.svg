<svg viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280" />
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#F4F6F8" />

  <!-- Title -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#1E2A38">Warehouse &amp; Shipment Operations Portal — Architecture</text>

  <!-- Client layer -->
  <rect x="60" y="80" width="260" height="140" rx="8" fill="#FFFFFF" stroke="#1E2A38" stroke-width="2"/>
  <text x="80" y="110" font-size="14" font-weight="600" fill="#1E2A38">Client (Browser)</text>
  <text x="80" y="135" font-size="12" fill="#374151">React (Vite) SPA</text>
  <text x="80" y="155" font-size="12" fill="#374151">Tailwind CSS design system</text>
  <text x="80" y="175" font-size="12" fill="#374151">Axios client + JWT interceptor</text>
  <text x="80" y="195" font-size="12" fill="#374151">Pages: Login, Dashboard</text>

  <!-- Arrow client -> server -->
  <line x1="320" y1="150" x2="420" y2="150" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="140" font-size="11" fill="#6B7280">HTTPS / REST</text>
  <text x="330" y="170" font-size="11" fill="#6B7280">Authorization: Bearer &lt;JWT&gt;</text>

  <!-- Server layer -->
  <rect x="420" y="60" width="300" height="300" rx="8" fill="#FFFFFF" stroke="#3B82C4" stroke-width="2"/>
  <text x="440" y="90" font-size="14" font-weight="600" fill="#1E2A38">Backend (Node.js + Express)</text>

  <rect x="440" y="105" width="260" height="55" rx="6" fill="#EAF2FA" stroke="#3B82C4"/>
  <text x="452" y="125" font-size="12" font-weight="600" fill="#1E2A38">Middleware</text>
  <text x="452" y="142" font-size="11" fill="#374151">authenticateToken (JWT verify)</text>
  <text x="452" y="157" font-size="11" fill="#374151">requireRole (admin/manager/staff)</text>

  <rect x="440" y="172" width="260" height="95" rx="6" fill="#F4F6F8" stroke="#D1D5DB"/>
  <text x="452" y="192" font-size="12" font-weight="600" fill="#1E2A38">Routes</text>
  <text x="452" y="210" font-size="11" fill="#374151">/api/auth  — register, login (bcrypt)</text>
  <text x="452" y="226" font-size="11" fill="#374151">/api/products — CRUD, role-gated writes</text>
  <text x="452" y="242" font-size="11" fill="#374151">/api/shipments — create + status PATCH,</text>
  <text x="452" y="257" font-size="11" fill="#374151">   auto stock deduction on create</text>

  <rect x="440" y="277" width="260" height="65" rx="6" fill="#EAF2FA" stroke="#3B82C4"/>
  <text x="452" y="297" font-size="12" font-weight="600" fill="#1E2A38">Data access</text>
  <text x="452" y="315" font-size="11" fill="#374151">pg (node-postgres) connection pool</text>
  <text x="452" y="330" font-size="11" fill="#374151">Parameterized queries (SQL injection safe)</text>

  <!-- Arrow server -> db -->
  <line x1="720" y1="210" x2="800" y2="210" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="722" y="200" font-size="11" fill="#6B7280">SQL over SSL</text>

  <!-- Database layer -->
  <rect x="800" y="80" width="140" height="280" rx="8" fill="#FFFFFF" stroke="#1B7A43" stroke-width="2"/>
  <text x="818" y="108" font-size="14" font-weight="600" fill="#1E2A38">PostgreSQL</text>
  <text x="818" y="126" font-size="11" fill="#6B7280">(Supabase-hosted)</text>

  <rect x="815" y="140" width="110" height="34" rx="5" fill="#EAF6EE" stroke="#1B7A43"/>
  <text x="825" y="161" font-size="11" fill="#1E2A38">users</text>

  <rect x="815" y="182" width="110" height="34" rx="5" fill="#EAF6EE" stroke="#1B7A43"/>
  <text x="825" y="203" font-size="11" fill="#1E2A38">warehouses</text>

  <rect x="815" y="224" width="110" height="34" rx="5" fill="#EAF6EE" stroke="#1B7A43"/>
  <text x="825" y="245" font-size="11" fill="#1E2A38">products</text>

  <rect x="815" y="266" width="110" height="34" rx="5" fill="#EAF6EE" stroke="#1B7A43"/>
  <text x="825" y="287" font-size="11" fill="#1E2A38">shipments</text>

  <text x="815" y="318" font-size="10" fill="#6B7280">FKs: products→warehouses,</text>
  <text x="815" y="332" font-size="10" fill="#6B7280">shipments→products</text>
  <text x="815" y="348" font-size="10" fill="#6B7280">Indexes on FK columns</text>

  <!-- Auth flow note -->
  <rect x="60" y="260" width="260" height="140" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
  <text x="80" y="288" font-size="13" font-weight="600" fill="#1E2A38">Auth &amp; RBAC flow</text>
  <text x="80" y="310" font-size="11" fill="#374151">1. Login → bcrypt.compare → JWT issued</text>
  <text x="80" y="328" font-size="11" fill="#374151">2. Token stored client-side, sent on</text>
  <text x="80" y="343" font-size="11" fill="#374151">   every request via Axios interceptor</text>
  <text x="80" y="361" font-size="11" fill="#374151">3. Backend requireRole() is the real</text>
  <text x="80" y="376" font-size="11" fill="#374151">   security boundary on every write</text>
  <text x="80" y="391" font-size="11" fill="#374151">4. Frontend also hides admin/manager-</text>
  <text x="80" y="406" font-size="11" fill="#374151">   only buttons from staff (UX only)</text>

  <!-- Request lifecycle banner -->
  <rect x="60" y="440" width="880" height="60" rx="8" fill="#1E2A38"/>
  <text x="80" y="463" font-size="12" font-weight="600" fill="#FFFFFF">Request lifecycle</text>
  <text x="80" y="484" font-size="11" fill="#D1D5DB">Browser → Axios (attaches JWT) → Express route → middleware chain (auth → role check) → SQL query → response → React state update → re-render</text>

  <!-- Deployment banner -->
  <rect x="60" y="516" width="880" height="60" rx="8" fill="#FFFFFF" stroke="#3B82C4" stroke-width="2"/>
  <text x="80" y="539" font-size="12" font-weight="600" fill="#1E2A38">Deployment (optional)</text>
  <text x="80" y="560" font-size="11" fill="#374151">Frontend on Vercel/Netlify, backend on Render, database on Supabase — all connected over HTTPS/SSL</text>

</svg>
